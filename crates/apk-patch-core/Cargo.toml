[package]
name = "apk-patch-core"
description = "Decode/build orchestration for apk-patch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apk-patch-meta = { path = "../apk-patch-meta" }
apk-patch-project = { path = "../apk-patch-project" }
apk-patch-sign = { path = "../apk-patch-sign" }
apk-patch-dex = { path = "../apk-patch-dex", default-features = false }
apk-patch-framework = { path = "../apk-patch-framework" }
apk-patch-resources = { path = "../apk-patch-resources", default-features = false }
apk-patch-vfs = { path = "../apk-patch-vfs", default-features = false }
axml-parser = { path = "../../../axml-parser" }
apkparser = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"

[features]
default = ["parallel", "aapt2", "native-fs", "goauld"]
parallel = ["apk-patch-dex/parallel"]
aapt2 = ["apk-patch-resources/aapt2"]
native-fs = ["apk-patch-vfs/native-fs"]
goauld = []

[dev-dependencies]
apk-patch-sign = { path = "../apk-patch-sign" }
apk-patch-framework = { path = "../apk-patch-framework" }
apk-patch-meta = { path = "../apk-patch-meta" }
apkparser = { workspace = true }
tempfile = "3.10"
dex-parser = { path = "../../../dex-parser/dexparser-rs" }
walkdir = { workspace = true }
