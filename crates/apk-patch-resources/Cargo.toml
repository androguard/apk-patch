[package]
name = "apk-patch-resources"
description = "ARSC / res tree decode helpers for apk-patch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axml-parser = { workspace = true }
apk-patch-vfs = { path = "../apk-patch-vfs", default-features = false }
thiserror = { workspace = true }
png = "0.17"
walkdir = { workspace = true }

[features]
default = ["aapt2"]
# Host aapt2 process spawn (not available on WASM).
aapt2 = []
