<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="An input APK is decoded into an editable project directory containing dex-txt, a text AndroidManifest.xml, and a res tree; after editing, build walks that directory back into a signed output APK.">
              <defs>
                <marker id="ph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#33608f"/>
                </marker>
                <marker id="pd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#a15c1f"/>
                </marker>
                <marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#4c7a3f"/>
                </marker>
              </defs>

              <rect x="30" y="115" width="150" height="90" rx="10" fill="#fffdf8" stroke="#ddd0b0" stroke-width="1.4"/>
              <text x="105" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#221c11">app.apk</text>
              <text x="105" y="172" text-anchor="middle" class="fig-label" fill="#6d6046">original</text>

              <rect x="370" y="65" width="220" height="180" rx="12" fill="#dfebd6" stroke="#4c7a3f" stroke-width="1.5"/>
              <text x="480" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#221c11">project/</text>
              <text x="480" y="110" text-anchor="middle" class="fig-label" fill="#6d6046">editable tree</text>
              <line x1="390" y1="122" x2="570" y2="122" stroke="#ddd0b0"/>
              <text x="480" y="142" text-anchor="middle" class="fig-label" fill="#6d6046">dex/ — dex-txt (§04)</text>
              <text x="480" y="160" text-anchor="middle" class="fig-label" fill="#6d6046">AndroidManifest.xml — text</text>
              <text x="480" y="178" text-anchor="middle" class="fig-label" fill="#6d6046">res/, assets/, lib/</text>
              <text x="480" y="196" text-anchor="middle" class="fig-label" fill="#6d6046">original/, unknown/</text>
              <text x="480" y="222" text-anchor="middle" class="fig-label" fill="#4c7a3f" font-weight="600">↑ you edit here</text>

              <rect x="720" y="115" width="150" height="90" rx="10" fill="#fffdf8" stroke="#a15c1f" stroke-width="1.6"/>
              <text x="795" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#221c11">app.apk</text>
              <text x="795" y="172" text-anchor="middle" class="fig-label" fill="#a15c1f" font-weight="600">signed by default</text>

              <path d="M182,150 C260,140 300,110 368,120" fill="none" stroke="#33608f" stroke-width="1.8" marker-end="url(#ph)"/>
              <text x="270" y="118" text-anchor="middle" class="fig-label" fill="#33608f">decode (§03)</text>

              <path d="M592,140 C650,140 680,150 718,155" fill="none" stroke="#a15c1f" stroke-width="1.8" marker-end="url(#pd)"/>
              <text x="655" y="122" text-anchor="middle" class="fig-label" fill="#a15c1f">build (§05)</text>

              <line x1="30" y1="270" x2="870" y2="270" stroke="#ddd0b0"/>
              <text x="30" y="296" font-size="11.5" fill="#6d6046">Apktool: smali, output left unsigned.  apk-patch: dex-txt, output signed v2+v3 by default (v1 currently off — §06).</text>
            </svg>