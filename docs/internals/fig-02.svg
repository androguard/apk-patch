<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Layered architecture. apk-patch-cli sits on apk-patch-core, which orchestrates seven feature crates: meta, project, dex, framework, resources, sign, and vfs. The dex crate depends on the external dex-parser and dex-bytecode crates; the resources crate depends on axml-parser. Several crates also depend on apkparser for ZIP and signing primitives.">
              <rect x="60" y="20" width="780" height="50" rx="9" fill="#fffdf8" stroke="#ddd0b0" stroke-width="1.4"/>
              <text x="450" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#221c11">apk-patch-cli — clap CLI, Apktool-compatible commands &amp; flags</text>

              <line x1="450" y1="70" x2="450" y2="98" stroke="#948569" stroke-width="1.4"/>
              <polygon points="450,102 445,94 455,94" fill="#948569"/>

              <rect x="60" y="104" width="780" height="50" rx="9" fill="#dfebd6" stroke="#4c7a3f" stroke-width="1.5"/>
              <text x="450" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#221c11">apk-patch-core — decode / build orchestration, generic over Vfs</text>

              <line x1="80" y1="174" x2="820" y2="174" stroke="#ddd0b0" stroke-width="1.4"/>
              <line x1="450" y1="154" x2="450" y2="174" stroke="#ddd0b0" stroke-width="1.4"/>

              <g font-size="10.5">
                <!-- 7 feature boxes -->
                <rect x="60" y="184" width="102" height="66" rx="7" fill="#f0dcb8" stroke="#a15c1f"/>
                <text x="111" y="212" text-anchor="middle" font-weight="700" fill="#221c11">meta</text>
                <text x="111" y="228" text-anchor="middle" font-size="9" fill="#6d6046">apkpatch.yml</text>
                <line x1="111" y1="174" x2="111" y2="184" stroke="#ddd0b0"/>

                <rect x="172" y="184" width="102" height="66" rx="7" fill="#f0dcb8" stroke="#a15c1f"/>
                <text x="223" y="212" text-anchor="middle" font-weight="700" fill="#221c11">project</text>
                <text x="223" y="228" text-anchor="middle" font-size="9" fill="#6d6046">layout, classify</text>
                <line x1="223" y1="174" x2="223" y2="184" stroke="#ddd0b0"/>

                <rect x="284" y="184" width="102" height="66" rx="7" fill="#f0dcb8" stroke="#a15c1f"/>
                <text x="335" y="212" text-anchor="middle" font-weight="700" fill="#221c11">dex</text>
                <text x="335" y="228" text-anchor="middle" font-size="9" fill="#6d6046">dex-txt (§04)</text>
                <line x1="335" y1="174" x2="335" y2="184" stroke="#ddd0b0"/>

                <rect x="396" y="184" width="102" height="66" rx="7" fill="#f0dcb8" stroke="#a15c1f"/>
                <text x="447" y="212" text-anchor="middle" font-weight="700" fill="#221c11">framework</text>
                <text x="447" y="228" text-anchor="middle" font-size="9" fill="#6d6046">install / cache</text>
                <line x1="447" y1="174" x2="447" y2="184" stroke="#ddd0b0"/>

                <rect x="508" y="184" width="102" height="66" rx="7" fill="#f0dcb8" stroke="#a15c1f"/>
                <text x="559" y="212" text-anchor="middle" font-weight="700" fill="#221c11">resources</text>
                <text x="559" y="228" text-anchor="middle" font-size="9" fill="#6d6046">ARSC (§06)</text>
                <line x1="559" y1="174" x2="559" y2="184" stroke="#ddd0b0"/>

                <rect x="620" y="184" width="102" height="66" rx="7" fill="#f0dcb8" stroke="#a15c1f"/>
                <text x="671" y="212" text-anchor="middle" font-weight="700" fill="#221c11">sign</text>
                <text x="671" y="228" text-anchor="middle" font-size="9" fill="#6d6046">v1/v2/v3</text>
                <line x1="671" y1="174" x2="671" y2="184" stroke="#ddd0b0"/>

                <rect x="732" y="184" width="108" height="66" rx="7" fill="#dce7f1" stroke="#33608f"/>
                <text x="786" y="212" text-anchor="middle" font-weight="700" fill="#221c11">vfs</text>
                <text x="786" y="228" text-anchor="middle" font-size="9" fill="#6d6046">StdFs / MemVfs</text>
                <line x1="786" y1="174" x2="786" y2="184" stroke="#ddd0b0"/>
              </g>

              <text x="60" y="264" class="fig-label" fill="#948569" font-weight="600" letter-spacing=".5">SIBLING ANDROGUARD CRATES — path dependencies, not owned by this workspace</text>

              <g font-size="10.5">
                <rect x="60" y="288" width="180" height="60" rx="7" fill="none" stroke="#948569" stroke-dasharray="4 4"/>
                <text x="150" y="315" text-anchor="middle" font-weight="700" fill="#221c11">apkparser</text>
                <text x="150" y="331" text-anchor="middle" font-size="9" fill="#6d6046">ZIP, manifest, split pkgs</text>

                <rect x="260" y="288" width="180" height="60" rx="7" fill="none" stroke="#948569" stroke-dasharray="4 4"/>
                <text x="350" y="315" text-anchor="middle" font-weight="700" fill="#221c11">axml-parser</text>
                <text x="350" y="331" text-anchor="middle" font-size="9" fill="#6d6046">AXML / ARSC codec</text>

                <rect x="460" y="288" width="180" height="60" rx="7" fill="none" stroke="#948569" stroke-dasharray="4 4"/>
                <text x="550" y="315" text-anchor="middle" font-weight="700" fill="#221c11">dex-parser</text>
                <text x="550" y="331" text-anchor="middle" font-size="9" fill="#6d6046">DEX parse + DexBuilder</text>

                <rect x="660" y="288" width="180" height="60" rx="7" fill="none" stroke="#948569" stroke-dasharray="4 4"/>
                <text x="750" y="315" text-anchor="middle" font-weight="700" fill="#221c11">dex-bytecode</text>
                <text x="750" y="331" text-anchor="middle" font-size="9" fill="#6d6046">insn decode / encode</text>
              </g>

              <path d="M335,250 C335,268 250,268 250,286" fill="none" stroke="#6d6046" stroke-width="1.3" marker-end="url(#pa)"/>
              <path d="M335,250 C335,268 550,268 550,286" fill="none" stroke="#6d6046" stroke-width="1.3" marker-end="url(#pa)"/>
              <path d="M335,250 C335,268 750,268 750,286" fill="none" stroke="#6d6046" stroke-width="1.3" marker-end="url(#pa)"/>
              <path d="M559,250 C559,268 350,268 350,286" fill="none" stroke="#6d6046" stroke-width="1.3" marker-end="url(#pa)"/>

              <text x="450" y="380" text-anchor="middle" class="fig-label" fill="#948569">apk-patch-core, -project, -sign and -framework also depend on apkparser directly (ZIP read/write, signing, manifest parse) — omitted above for clarity.</text>
            </svg>